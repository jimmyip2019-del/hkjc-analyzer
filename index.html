<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>六合彩統計分析（本地儲存版）</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0b0f17;color:#e5e7eb;font-family:-apple-system,"PingFang HK",sans-serif}
  .card{background:#131a26;border:1px solid #1f2937;border-radius:14px;padding:16px;margin-bottom:14px}
  .ball{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-weight:700;color:#fff;margin:3px;font-size:15px}
  .br{background:linear-gradient(160deg,#ff6b6b,#c81e1e)}
  .bb{background:linear-gradient(160deg,#60a5fa,#1d4ed8)}
  .bg{background:linear-gradient(160deg,#4ade80,#15803d)}
  .gold{box-shadow:0 0 0 3px #facc15}
  .dan{box-shadow:0 0 0 3px #f59e0b}
  .leg{box-shadow:0 0 0 2px #64748b}
  .btn{background:#dc2626;color:#fff;padding:.8rem 1.4rem;border-radius:10px;font-weight:600;width:100%;cursor:pointer;border:none;font-size:1rem}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn2{background:#1f2937;color:#e5e7eb;padding:.5rem 1rem;border-radius:8px;cursor:pointer;border:none;font-size:.85rem}
  .btn-danger{background:#7f1d1d;color:#fca5a5;padding:.5rem 1rem;border-radius:8px;cursor:pointer;border:none;font-size:.85rem}
  table{width:100%;font-size:12px}td,th{padding:4px}
  textarea{width:100%;background:#1f2937;border:1px solid #374151;border-radius:8px;padding:10px;color:#fff;font-size:13px;margin-bottom:10px}
</style>
</head>
<body class="min-h-screen">
<div class="max-w-3xl mx-auto p-4">

  <h1 class="text-xl font-bold mb-4">🎰 六合彩統計分析（本地儲存版）</h1>

  <!-- 數據管理區 -->
  <div class="card">
    <div class="flex items-center justify-between mb-2">
      <div class="font-bold text-sm">📊 數據庫狀態</div>
      <div id="dbStatus" class="text-xs text-slate-400">載入中…</div>
    </div>
    <div class="flex gap-2 mb-3">
      <button class="btn2" onclick="exportData()">📤 匯出數據</button>
      <button class="btn-danger" onclick="clearData()">🗑️ 清空數據</button>
    </div>
    <div class="text-sm font-bold mb-2">📋 貼上開獎數據</div>
    <div class="text-xs text-slate-400 mb-2">
      格式：<code>2026-09-13 5,12,18,29,35,46 + 7</code>（每行一期，支援多行）
    </div>
    <textarea id="msInput" rows="6" placeholder="2026-09-13 5,12,18,29,35,46 + 7&#10;2026-09-10 3,9,21,28,37,42 + 15"></textarea>
    <button id="b1" class="btn" onclick="saveAndAnalyze()">💾 儲存並分析</button>
    <div id="status" class="text-xs text-slate-500 mt-2"></div>
  </div>

  <div class="card">
    <div class="text-sm text-slate-400 mb-1">下期搞珠日期</div>
    <div id="nextDates" class="text-amber-400 font-bold"></div>
  </div>

  <div id="out"></div>

  <p class="text-xs text-slate-500 mt-6">
    ⚠️ 六合彩每期獨立隨機，統計評分不能預測結果。只供學習。<br>
    💾 數據儲存喺你手機瀏覽器，唔會上傳。清除瀏覽器資料會清空。
  </p>
</div>

<script>
const $ = id => document.getElementById(id);
const RED = new Set([1,2,7,8,12,13,18,19,23,24,29,30,34,35,40,45,46]);
const BLUE = new Set([3,4,9,10,14,15,20,25,26,31,36,37,41,42,47,48]);
const cc = n => RED.has(n)?'br':BLUE.has(n)?'bb':'bg';
const pad = n => String(n).padStart(2,'0');
const ball = (n, cls='') => `<span class="ball ${cc(n)} ${cls}">${pad(n)}</span>`;

// ===== 本地儲存 =====
function loadDraws(){
  try{ return JSON.parse(localStorage.getItem('hkjc_draws') || '[]'); }
  catch(e){ return []; }
}
function saveDraws(draws){
  localStorage.setItem('hkjc_draws', JSON.stringify(draws));
}
function updateDbStatus(){
  const draws = loadDraws();
  if(draws.length === 0){
    $('dbStatus').textContent = '冇數據，請先貼上';
    $('dbStatus').className = 'text-xs text-yellow-400';
  } else {
    $('dbStatus').textContent = `共 ${draws.length} 期（最新：${draws[0].date}）`;
    $('dbStatus').className = 'text-xs text-green-400';
  }
}

function parseInput(text){
  const draws = [];
  text.split('\n').forEach(line=>{
    line = line.trim();
    if(!line) return;
    // 格式：YYYY-MM-DD 1,2,3,4,5,6 + 7
    const match = line.match(/(\d{4}-\d{2}-\d{2})\s+([\d,]+)\s*\+\s*(\d+)/);
    if(!match) return;
    const date = match[1];
    const main = match[2].split(',').map(Number).filter(n=>n>=1 && n<=49).sort((a,b)=>a-b);
    const special = parseInt(match[3]);
    if(main.length === 6 && special >= 1 && special <= 49){
      draws.push({date, main, special});
    }
  });
  return draws;
}

function mergeDraws(newDraws){
  const existing = loadDraws();
  const map = new Map();
  existing.forEach(d => map.set(d.date, d));
  newDraws.forEach(d => map.set(d.date, d)); // 新數據覆蓋舊數據
  const merged = Array.from(map.values()).sort((a,b)=>b.date.localeCompare(a.date));
  saveDraws(merged);
  return merged;
}

function clearData(){
  if(confirm('確定清空所有歷史數據？呢個動作無法復原。')){
    localStorage.removeItem('hkjc_draws');
    updateDbStatus();
    $('out').innerHTML = '';
  }
}

function exportData(){
  const draws = loadDraws();
  if(draws.length === 0){ alert('冇數據可匯出'); return; }
  const text = draws.map(d=>`${d.date} ${d.main.join(',')} + ${d.special}`).join('\n');
  // 複製到剪貼板
  navigator.clipboard.writeText(text).then(()=>{
    alert('已複製到剪貼板！你可以貼去備忘錄保存。');
  }).catch(()=>{
    prompt('請手動複製以下數據：', text);
  });
}

// ===== 分析邏輯 =====
function scoreNumbers(draws){
  if(!draws.length) return {};
  const total = draws.length;
  const freq={}, lastSeen={}, recent={};
  draws.forEach((d,i)=>{
    [...d.main, d.special].forEach(n=>{
      freq[n]=(freq[n]||0)+1;
      if(lastSeen[n]===undefined) lastSeen[n]=i;
    });
    if(i<20) d.main.forEach(n=>recent[n]=(recent[n]||0)+1);
  });
  const maxF = Math.max(...Object.values(freq), 1);
  const out = {};
  for(let n=1;n<=49;n++){
    const f=freq[n]||0, ls=lastSeen[n]??total, r=recent[n]||0;
    const s = 0.40*(f/maxF) + 0.35*Math.min(ls/total,1) + 0.25*Math.min(r/6,1);
    out[n] = {n, score:+s.toFixed(4), freq:f, gap:ls, recent20:r};
  }
  return out;
}

function buildDantuo(scores){
  const sorted = Object.values(scores).sort((a,b)=>b.score-a.score);
  const dan = sorted.slice(0,3).map(x=>x.n);
  const leg = sorted.slice(3,9).map(x=>x.n);
  const tickets = [];
  for(let i=0;i<leg.length;i++)
    for(let j=i+1;j<leg.length;j++)
      for(let k=j+1;k<leg.length;k++)
        tickets.push([...dan, leg[i], leg[j], leg[k]].sort((a,b)=>a-b));
  return {dan, leg, tickets, n: tickets.length, cost: tickets.length*10};
}

function isMSDay(d){ return [2,4,6].includes(d.getDay()); }
function nextMS(n=5){
  const out=[], d=new Date();
  while(out.length<n){ if(isMSDay(d)) out.push(new Date(d)); d.setDate(d.getDate()+1); }
  return out;
}

function render(draws){
  if(draws.length < 3){
    $('out').innerHTML = '<div class="card text-yellow-400">數據不足 3 期，請繼續貼上更多數據。</div>';
    return;
  }
  const scores = scoreNumbers(draws);
  const dt = buildDantuo(scores);
  const nxt = nextMS(1)[0];
  const nxtStr = `${nxt.getFullYear()}-${pad(nxt.getMonth()+1)}-${pad(nxt.getDate())}`;
  const wd = ['日','一','二','三','四','五','六'];
  const latest = draws[0];
  const ranked = Object.values(scores).sort((a,b)=>b.score-a.score);

  $('out').innerHTML = `
    <div class="card">
      <div class="text-sm text-slate-400 mb-1">最新一期 ${latest.date}</div>
      <div>${latest.main.map(n=>ball(n)).join('')}<span class="text-slate-500 mx-1">|</span>${ball(latest.special,'gold')}</div>
    </div>
    <div class="card">
      <div class="text-sm text-slate-400 mb-2">下期：${nxtStr}（星期${wd[nxt.getDay()]}）</div>
      <div class="font-bold text-amber-400 mb-2">3 膽（每注必含）</div>
      <div>${dt.dan.map(n=>ball(n,'dan')).join('')}</div>
      <div class="font-bold text-slate-300 mb-2 mt-4">6 腳（選 3 組合）</div>
      <div>${dt.leg.map(n=>ball(n,'leg')).join('')}</div>
      <div class="mt-4 text-sm">注數 <b>${dt.n}</b>｜成本 <b>$${dt.cost}</b></div>
    </div>
    <div class="card">
      <div class="font-bold mb-2">首 10 注組合</div>
      ${dt.tickets.slice(0,10).map((t,i)=>`<div class="text-sm py-1">${i+1}. ${t.map(n=>ball(n)).join('')}</div>`).join('')}
    </div>
    <div class="card">
      <div class="font-bold mb-2">評分明細（前 15）</div>
      <table>
        <tr class="text-slate-500"><th>號</th><th>評分</th><th>出現</th><th>遺漏</th><th>近20</th></tr>
        ${ranked.slice(0,15).map(x=>`<tr class="border-t border-slate-800"><td>${ball(x.n)}</td><td class="text-center">${x.score}</td><td class="text-center">${x.freq}</td><td class="text-center">${x.gap}</td><td class="text-center">${x.recent20}</td></tr>`).join('')}
      </table>
    </div>
  `;
}

function saveAndAnalyze(){
  const btn = $('b1');
  btn.disabled = true; btn.textContent = '處理中…';
  $('status').textContent = '';

  try{
    const raw = $('msInput').value.trim();
    if(!raw) throw new Error('請先貼上開獎數據');

    const newDraws = parseInput(raw);
    if(newDraws.length === 0) throw new Error('解析唔到任何數據，請檢查格式');

    const merged = mergeDraws(newDraws);
    $('status').textContent = `成功儲存 ${newDraws.length} 期（總共 ${merged.length} 期）`;
    $('msInput').value = ''; // 清空輸入框
    updateDbStatus();
    render(merged);
  }catch(e){
    $('status').textContent = '❌ ' + e.message;
  }finally{
    btn.disabled = false; btn.textContent = '💾 儲存並分析';
  }
}

// ===== 初始化 =====
function init(){
  updateDbStatus();
  const dates = nextMS(5);
  const wd = ['日','一','二','三','四','五','六'];
  $('nextDates').textContent = dates.map(d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}（${wd[d.getDay()]}）`).join(' ｜ ');
  
  const existing = loadDraws();
  if(existing.length > 0) render(existing);
}

init();
</script>
</body>
</html>
